  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --bg:          #131210;  /* deep warm near-black — "night" */
      --bg-glow:     #1d1b16;  /* faint lift behind the hero */
      --bone:        #ede8dc;  /* primary text — warm bone */
      --bone-dim:    #b4ad9d;  /* secondary text */
      --muted:       #7d776a;  /* labels, captions */
      --accent:      #f6b2cd;  /* brand pink (sampled from the logos) */
      --accent-soft: #f6b2cd40;
      --hair:        #ede8dc1f; /* hairline rules */

      --serif: "Fraunces", Georgia, serif;
      --sans:  "Inter", system-ui, sans-serif;
      --mono:  "Space Mono", ui-monospace, monospace;
    }

    /* ============================================================
       BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      background-image: radial-gradient(60% 45% at 50% 8%, var(--bg-glow) 0%, var(--bg) 60%);
      color: var(--bone);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      justify-content: center;
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: clamp(20px, 5vw, 56px);
      padding: clamp(32px, 6vw, 64px) clamp(24px, 6vw, 56px) clamp(36px, 5vw, 48px);
      border: 1px solid var(--hair);
    }
    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 9px; height: 9px;
      border: 1px solid var(--accent-soft);
    }
    .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

    /* ============================================================
       HERO — Hindia Cat
       ============================================================ */
    .crest {
      display: block;
      width: clamp(140px, 40vw, 196px);
      height: auto;
      margin: 4px 0 26px;
    }

    .meta {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0;
    }

    .rule {
      height: 1px;
      background: var(--hair);
      border: 0;
      margin: 30px 0 28px;
    }

    .lede {
      font-size: 14px;
      color: var(--bone-dim);
      margin: 0 0 30px;
    }

    /* ============================================================
       FORM
       ============================================================ */
    .field { margin-bottom: 26px; }

    .field > label {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .field .req { color: var(--accent); }

    .control {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--hair);
      color: var(--bone);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      padding: 6px 0 9px;
      transition: border-color 0.25s ease;
      border-radius: 0;
    }
    .control::placeholder { color: #ede8dc40; }
    .control:hover { border-bottom-color: #ede8dc33; }
    .control:focus { outline: none; border-bottom-color: var(--accent); }
    textarea.control { resize: vertical; min-height: 44px; }
    input[type="number"].control { -moz-appearance: textfield; appearance: textfield; }
    input[type="number"].control::-webkit-outer-spin-button,
    input[type="number"].control::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* ============================================================
       SUBMIT
       ============================================================ */
    .submit {
      margin-top: 36px;
      width: 100%;
      background: transparent;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      padding: 16px 20px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .submit:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .submit:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .submit:disabled { opacity: 0.5; cursor: progress; }

    .status {
      font-size: 13px;
      color: #d98b73;
      margin-top: 16px;
      min-height: 1em;
    }

    /* ============================================================
       FOOTER — colophon: 1024 logo over email
       ============================================================ */
    .colophon {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--hair);
      text-align: center;
    }
    .colophon .mark {
      display: inline-block;
      width: 56px;
      height: auto;
      margin-bottom: 14px;
    }
    .colophon .email {
      display: block;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--bone-dim);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .colophon .email:hover { color: var(--accent); }

    /* ============================================================
       SUCCESS STATE
       ============================================================ */
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 22px;
    }
    .done { display: none; text-align: left; }
    .done.show { display: block; animation: rise 0.6s ease both; }
    .done h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin: 0 0 16px;
    }
    .done p {
      color: var(--bone-dim);
      font-size: 15px;
      margin: 0 0 8px;
      max-width: 42ch;
    }
    .done .echo {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 22px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

        notes:   $("notes").value.trim(),
      };

      if (!data.name)    { setError("Please add your name."); $("name").focus(); return; }
      if (!data.pax || Number(data.pax) < 1) { setError("Please enter how many guests (1 or more)."); $("pax").focus(); return; }
      if (!data.contact) { setError("Please add a contact so we can reach you."); $("contact").focus(); return; }

      if (SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
        setError("Form isn't connected yet — add your Apps Script URL in the page source.");
        return;
      }

      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "Sending…";

      try {
        const body = new FormData();
        Object.entries(data).forEach(([k, v]) => body.append(k, v));
        await fetch(SCRIPT_URL, { method: "POST", body, mode: "no-cors" });
        showSuccess(data);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        setError("Something went wrong sending that. Please try again.");
        console.error(err);
      }
    }

    function showSuccess(data) {
      $("echo").textContent = data.name + " · " + data.pax + " pax";
      $("invite").style.display = "none";
      $("done").classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    btn.addEventListener("click", submitForm);
    document.querySelectorAll('#rsvp input').forEach((el) => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); submitForm(); }
      });
    });
  </script>
</body>
</html>
